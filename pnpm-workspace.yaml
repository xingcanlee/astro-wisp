packages:
  - packages/*
  - template

# template/ 依赖的是发布版本号（"astro-wisp": "^x.y.z"），在本仓库内也链接到 packages/astro-wisp，
# 这样 starter 用到的就是当前源码；用户通过 create-astro 复制 template 后则从 npm 安装。
linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild
  - sharp

# @astrojs/check → @napi-rs/wasm-runtime 拉到的 @emnapi 2.0 beta 会让 astro check 崩溃（this.bridge.deleteEnv is not a function）。
# template/package.json 中有同样的覆盖，供复制出去的站点使用。
overrides:
  '@napi-rs/wasm-runtime@1.2.4>@emnapi/runtime': 1.11.3
  '@napi-rs/wasm-runtime@1.2.4>@emnapi/core': 1.11.3
